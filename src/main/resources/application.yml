server:
  port: 8080

spring:
  application:
    name: java-remittance
  datasource:
    url: jdbc:h2:mem:remittancedb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.bigfake.remittance: INFO
